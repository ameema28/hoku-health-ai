[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --cov --cov-fail-under=80
pythonpath = .
markers =
    pgvector: needs a real PostgreSQL + pgvector database (DATABASE_URL=postgresql://...)
filterwarnings =
    error::langchain_core._api.deprecation.LangChainDeprecationWarning