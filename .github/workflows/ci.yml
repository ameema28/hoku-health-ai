# =============================================================================
# Hoku Health Care - Continuous Integration (Day 10)
#
# Gates every PR into `main`/`develop` on:
#   1. ruff   - lint + import order
#   2. mypy   - static types on app/
#   3. pytest - full suite (unit + integration) with coverage >= 80%
#
# The Groq API is NEVER called in CI. GROQ_API_KEY is set to a dummy
# value; every test that touches the LLM patches ChatGroq / LLMChain.
# =============================================================================
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  # Dummy key: satisfies AISettings validation without enabling real calls.
  GROQ_API_KEY: gsk_ci_dummy_key_never_used
  ENVIRONMENT: test
  RATE_LIMIT_ENABLED: "false"
  LOG_FORMAT: plain

jobs:
  # ---------------------------------------------------------------------------
  lint:
    name: Lint (ruff) & Types (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: ruff check
        run: ruff check app tests

      - name: ruff format --check
        run: ruff format --check app tests
        continue-on-error: true   # formatting is advisory until Day 11

      - name: mypy
        run: mypy app --ignore-missing-imports --no-strict-optional
        continue-on-error: true

  # ---------------------------------------------------------------------------
  test:
    name: Tests & Coverage
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: hoku
          POSTGRES_PASSWORD: hoku_ci_password
          POSTGRES_DB: hoku_health_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hoku -d hoku_health_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Unit tests use the SQLite fixture hard-coded in tests/conftest.py.
      # Integration tests read TEST_DATABASE_URL and fall back to SQLite
      # when it is absent, so the suite stays runnable on a laptop.
      DATABASE_URL: sqlite:///./ci.db
      TEST_DATABASE_URL: postgresql://hoku:hoku_ci_password@localhost:5432/hoku_health_test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Enable pgvector extension
        run: |
          PGPASSWORD=hoku_ci_password psql -h localhost -U hoku -d hoku_health_test \
            -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Cache HuggingFace embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-all-MiniLM-L6-v2

      - name: Run test suite with coverage
        run: pytest tests/ --cov-report=xml --ignore=tests/load

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 7

  # ---------------------------------------------------------------------------
  docker:
    name: Docker Build Smoke Test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no embedding preload, keeps CI fast)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: hoku-health-backend:ci
          build-args: |
            PRELOAD_EMBEDDINGS=false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Boot container and hit the health endpoint
        run: |
          docker run -d --name hoku-ci \
            -e GROQ_API_KEY=gsk_ci_dummy_key_never_used \
            -e DATABASE_URL=sqlite:///./ci.db \
            -e ENVIRONMENT=test \
            -p 8000:8000 \
            hoku-health-backend:ci
          for i in $(seq 1 30); do
            if curl --fail --silent http://localhost:8000/api/ai/health; then
              echo "" && echo "Health check passed on attempt $i"
              exit 0
            fi
            sleep 3
          done
          echo "Health check never passed - container logs:"
          docker logs hoku-ci
          exit 1

      - name: Tear down
        if: always()
        run: docker rm -f hoku-ci || true