# =============================================================================
# Hoku Health Care - Continuous Integration
#
# Every PR into `main`/`develop` must pass (all blocking):
#   1. lint      - ruff check, ruff format --check, mypy app (strict optional)
#   2. test      - full suite, coverage >= 80% with NO omitted modules
#   3. pgvector  - migrations + seeding + unmocked similarity search on
#                  pgvector/pgvector:pg16
#   4. docker    - image builds, boots, and refuses to start in production
#                  with a short SECRET_KEY
#
# No API keys are configured: the Groq API is never called in CI (every LLM
# path is mocked or falls back), and tests generate their own random
# SECRET_KEY (root conftest.py).
# =============================================================================
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  ENVIRONMENT: test
  RATE_LIMIT_ENABLED: "false"
  LOG_FORMAT: plain

jobs:
  # ---------------------------------------------------------------------------
  lint:
    name: Lint (ruff) & Types (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies (CPU torch first)
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.15.0
          pip install -r requirements-dev.txt -c constraints.txt

      - name: ruff check
        run: ruff check app tests scripts

      - name: ruff format --check
        run: ruff format --check app tests scripts

      - name: mypy (settings in mypy.ini)
        run: mypy app

  # ---------------------------------------------------------------------------
  test:
    name: Tests & Coverage
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: hoku
          POSTGRES_PASSWORD: hoku_ci_password
          POSTGRES_DB: hoku_health_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hoku -d hoku_health_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Unit tests use throwaway SQLite files (tests/db_utils.py); nothing is
      # written into the checkout.
      # Integration tests read TEST_DATABASE_URL (Postgres here).
      DATABASE_URL: sqlite:////tmp/hoku-ci.db
      TEST_DATABASE_URL: postgresql://hoku:hoku_ci_password@localhost:5432/hoku_health_test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies (CPU torch first)
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.15.0
          pip install -r requirements-dev.txt -c constraints.txt

      - name: Cache HuggingFace embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-all-MiniLM-L6-v2

      # Gate: --cov-fail-under=80 (pytest.ini) over every module in app/
      # (.coveragerc has no omit list).
      - name: Run test suite with coverage
        run: pytest tests/ --cov-report=xml --ignore=tests/load -p no:cacheprovider

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 7

  # ---------------------------------------------------------------------------
  pgvector:
    name: pgvector (migrations + real similarity search)
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: hoku
          POSTGRES_PASSWORD: hoku_ci_password
          POSTGRES_DB: hoku_pgvector
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hoku -d hoku_pgvector"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://hoku:hoku_ci_password@localhost:5432/hoku_pgvector

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies (CPU torch first)
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.15.0
          pip install -r requirements-dev.txt -c constraints.txt

      - name: Cache HuggingFace embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-all-MiniLM-L6-v2

      # No manual CREATE EXTENSION: migration 003 must enable pgvector itself.
      - name: alembic upgrade head
        run: alembic upgrade head

      - name: alembic check (models match the migrated schema)
        run: alembic check

      - name: Seed doctors (idempotent)
        run: python init_db.py --no-faqs

      - name: pgvector tests (unmocked)
        run: pytest tests/pgvector -m pgvector --no-cov -p no:cacheprovider

  # ---------------------------------------------------------------------------
  docker:
    name: Docker Build Smoke Test
    runs-on: ubuntu-latest
    needs: [test, pgvector]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (embedding model baked in)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: hoku-health-ai:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Image defaults: SQLite in /tmp, migrations + seeding at start-up.
      # The health payload must report rag_ready=true (model + FAQ index).
      - name: Boot container and wait for a ready /health
        run: |
          docker run -d --name hoku-ci \
            -e ENVIRONMENT=test \
            -p 8080:8080 \
            hoku-health-ai:ci
          for i in $(seq 1 40); do
            body=$(curl --fail --silent http://localhost:8080/health || true)
            if echo "$body" | grep -q '"rag_ready":true'; then
              echo "$body" && echo "Ready on attempt $i"
              exit 0
            fi
            sleep 3
          done
          echo "Never ready - container logs:"
          docker logs hoku-ci
          exit 1

      # CI installs requirements-dev.txt; this checks the image's own tree.
      # groq 0.9.0 cannot build a client on httpx 0.28 (every reply would
      # silently be a fallback), so construct one offline with a fake key.
      - name: Groq client can be constructed inside the image
        run: |
          docker run --rm --network none --entrypoint python hoku-health-ai:ci -c \
            "import groq; groq.Groq(api_key='gsk_ci_fake'); print('groq client OK')"

      - name: Refuses to start in production with a short SECRET_KEY
        run: |
          set +e
          timeout 60 docker run --rm \
            -e ENVIRONMENT=production \
            -e SECRET_KEY=too-short \
            hoku-health-ai:ci
          code=$?
          set -e
          echo "exit code: $code"
          if [ "$code" -eq 0 ] || [ "$code" -eq 124 ]; then
            echo "Expected a non-zero startup failure (124 = still running after 60s)"
            exit 1
          fi

      - name: Tear down
        if: always()
        run: docker rm -f hoku-ci || true
