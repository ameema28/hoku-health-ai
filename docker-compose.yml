# =============================================================================
# Hoku Health Care - local stack: PostgreSQL + pgvector, migrations, app.
#
#   docker compose up -d --build     # "migrate" runs init_db.py before "app"
#   open http://localhost:8000/      # demo page (demo login is on here)
#   docker compose logs -f app
#   docker compose down              # add -v to delete the database volume
#
# SECRET_KEY must be in your .env (32+ characters). GROQ_API_KEY is optional:
# without it every reply is a fallback built from FAQ/doctor data.
# The postgres image ships pgvector; migration 003 enables it (the compose
# user is a superuser).
# =============================================================================

x-app-env: &app-env
  DATABASE_URL: postgresql://${POSTGRES_USER:-hoku}:${POSTGRES_PASSWORD:-hoku_dev_password}@postgres:5432/${POSTGRES_DB:-hoku_health}
  SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set in .env (32+ characters)}
  GROQ_API_KEY: ${GROQ_API_KEY:-}
  ENVIRONMENT: ${ENVIRONMENT:-development}
  LOG_FORMAT: ${LOG_FORMAT:-json}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: hoku-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hoku}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hoku_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-hoku_health}
      # Deterministic collation so ORDER BY on doctor names is stable
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - hoku_pgdata:/var/lib/postgresql/data
      - ./scripts/init-pgvector.sql:/docker-entrypoint-initdb.d/00-pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hoku} -d ${POSTGRES_DB:-hoku_health}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - hoku-net

  # One-shot: alembic upgrade head + idempotent doctor/FAQ seeding.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    image: hoku-health-ai:local
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "init_db.py"]
    environment:
      <<: *app-env
    networks:
      - hoku-net

  app:
    image: hoku-health-ai:local
    container_name: hoku-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *app-env
      DB_AUTO_MIGRATE: "false"   # the migrate service already ran
      DEMO_LOGIN_ENABLED: ${DEMO_LOGIN_ENABLED:-true}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      RATE_LIMIT_REQUESTS_PER_MINUTE: ${RATE_LIMIT_REQUESTS_PER_MINUTE:-10}
      CHAT_IP_RATE_PER_MINUTE: ${CHAT_IP_RATE_PER_MINUTE:-20}
      DEMO_RATE_LIMIT_PER_HOUR: ${DEMO_RATE_LIMIT_PER_HOUR:-20}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-5}
    ports:
      - "${APP_PORT:-8000}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - hoku-net

volumes:
  hoku_pgdata:
    driver: local

networks:
  hoku-net:
    driver: bridge
